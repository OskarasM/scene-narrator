# Publishes the package to npm when a GitHub release is published.
#
# Publishing from CI rather than from a laptop is not ceremony here. It means the tarball on
# npm is built by the same job that ran the tests, from a commit anyone can read, and
# --provenance attaches a signed statement saying exactly which workflow run and which commit
# produced it. For a package whose entire argument is "every number came from something you
# can rerun", a publish nobody can trace would be the wrong way to ship it.
#
# Authentication is npm trusted publishing over OIDC. There is no token anywhere: GitHub
# mints a short-lived identity token for this specific workflow in this specific repository,
# and npm accepts a publish only from the publisher it has been told to trust. A stolen
# repository secret is not a thing that can happen, because there is no secret to steal.
#
# The trust is registered at npmjs.com -> the package -> Settings -> Trusted Publisher, as
# organisation OskarasM, repository scene-narrator, workflow file publish.yml, and no
# environment. Those four values have to keep matching this file. Renaming this workflow, or
# adding an `environment:` to the job below, breaks publishing until the npm side is updated
# to match, and the error will not say so.
#
# To release: `gh release create v0.1.0 --generate-notes`.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for --provenance. Without it the publish still works, silently, without the
  # signed link back to this commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs the prose check, the build and the tests, so this is belt and
      # braces. It is here anyway because a publish that fails after the version is gone
      # from the registry's point of view is worse than one that fails early.
      - run: npm run check:prose
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # No NODE_AUTH_TOKEN. Authentication comes from the OIDC token that `id-token: write`
      # above allows GitHub to mint. Setting a token here would take precedence over trusted
      # publishing and quietly put the credential back in the loop.
      - run: npm publish --access public --provenance
