# Deploys the demo to GitHub Pages on every push to main.
#
# The demo is built from src/ rather than from the published package, so whatever is
# deployed is exactly the commit it was built from. That is the point: the live demo is
# evidence about this repository, not about a tarball somebody has to trust separately.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, write a Pages deployment, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Cancelling an in-progress run rather than queueing means a
# rapid series of pushes does not leave an older build racing a newer one to production.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The root install is needed as well as the demo's: the demo aliases the library
      # straight at ../src, and the root holds the tooling that lints and types it.
      - run: npm ci
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
        env:
          DEMO_BASE: /scene-narrator/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
